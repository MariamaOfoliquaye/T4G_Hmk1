<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Age-Based Registration · T4G_Hmk1</title>

    <!-- Google Font & Font Awesome (CDN) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- Custom styles - now pointing to src/ -->
    <link rel="stylesheet" href="src/style.css" />
</head>
<body>

    <div class="card">

        <!-- HEADER -->
        <div class="header">
            <i class="fas fa-user-check"></i>
            <h1>Register</h1>
        </div>
        <p class="subtitle">
            <i class="fas fa-chevron-right" style="font-size:0.7rem; margin-right:6px; color:#2563eb;"></i>
            Enter your details &amp; we'll tailor the response based on your age.
        </p>

        <!-- FORM -->
        <form id="registerForm" autocomplete="off">
            <div class="form-group">
                <label for="username">
                    <i class="fas fa-user"></i> Username
                </label>
                <input type="text" id="username" placeholder="e.g. jordan_23" required />
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="age">
                        <i class="fas fa-calendar-alt"></i> Age
                    </label>
                    <input type="number" id="age" placeholder="e.g. 16" min="1" max="120" required />
                </div>

                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i> Email
                    </label>
                    <input type="email" id="email" placeholder="you@example.com" required />
                </div>
            </div>

            <button type="submit" class="btn-submit">
                <i class="fas fa-paper-plane"></i> Check Eligibility
            </button>
        </form>

        <!-- ALERT OUTPUT -->
        <div id="alertBox" class="alert-box info">
            <i class="fas fa-info-circle"></i>
            <div class="msg">
                <span id="alertMessage">
                    <i class="fas fa-hand-point-right" style="color:#2563eb; margin-right:6px;"></i>
                    Fill in the form and click <strong>Check Eligibility</strong>
                </span>
            </div>
        </div>

        <!-- FOOTER HINT -->
        <div class="hint">
            <i class="fas fa-table"></i> Conditions applied &bull; see table in image
        </div>
    </div>

    <!-- JavaScript - now pointing to src/ -->
    <script src="src/script.js" defer></script>
</body>
</html>
